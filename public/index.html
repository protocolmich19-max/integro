<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подкидной дурак 36 карт</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="background"></div>
  <div class="app-shell">
    <header class="top-bar">
      <h1>Подкидной дурак · 36 карт</h1>
      <div class="status" id="status">Ожидание подключения…</div>
      <div class="timer" id="timer"></div>
    </header>

    <section class="scoreboard">
      <div class="player-card" id="you-card">
        <h2 class="player-name" id="you-name">Вы</h2>
        <div class="player-meta">
          <span class="role" id="you-role"></span>
          <span class="credits" id="you-credits"></span>
        </div>
        <div class="hand" id="your-hand"></div>
      </div>
      <div class="trump-area">
        <div class="deck-info">
          <div class="deck-count" id="deck-count">36</div>
          <span>Карт в колоде</span>
        </div>
        <div class="trump-card">
          <span class="label">Козырь</span>
          <div class="card" id="trump-card"></div>
        </div>
        <div class="discard-info">
          <div class="discard-count" id="discard-count">0</div>
          <span>Сброс</span>
        </div>
      </div>
      <div class="player-card" id="opponent-card">
        <h2 class="player-name" id="opponent-name">Ожидание</h2>
        <div class="player-meta">
          <span class="role" id="opponent-role"></span>
          <span class="credits" id="opponent-credits"></span>
        </div>
        <div class="hand" id="opponent-hand"></div>
      </div>
    </section>

    <section class="table-area">
      <div class="table-header">
        <h2>Игровой стол</h2>
        <div class="table-actions">
          <button id="take-button" class="action secondary" disabled>Беру</button>
          <button id="end-turn-button" class="action primary" disabled>Бито</button>
        </div>
      </div>
      <div class="cards-on-table" id="table-cards"></div>
    </section>

    <section class="log-area">
      <h3>Ход партии</h3>
      <ul id="log"></ul>
    </section>
  </div>

  <div class="join-overlay" id="join-overlay">
    <form class="join-form" id="join-form">
      <h2>Войти в игру</h2>
      <label class="field">
        <span>Ваш ник</span>
        <input type="text" id="name-input" maxlength="20" placeholder="Например, Kozir" required />
      </label>
      <label class="field">
        <span>Комната</span>
        <input type="text" id="room-input" maxlength="20" value="default" />
      </label>
      <button type="submit" class="action primary wide">Присоединиться</button>
      <p class="hint">Игра запускается автоматически, как только в комнате окажутся два игрока.</p>
    </form>
  </div>

  <template id="card-template">
    <div class="card">
      <span class="rank"></span>
      <span class="suit"></span>
    </div>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
